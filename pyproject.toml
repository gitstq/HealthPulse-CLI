[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "healthpulse-cli"
version = "1.0.0"
description = "🩺 HealthPulse-CLI - Lightweight Terminal Code Repository Health Diagnosis Engine | 轻量级终端代码仓库健康度智能诊断引擎"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "HealthPulse Team"}
]
keywords = ["code-quality", "health-check", "cli", "static-analysis", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
healthpulse = "healthpulse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
